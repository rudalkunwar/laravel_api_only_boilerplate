name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4.27
          tools: composer:v2
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-lint-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Check code style (Pint)
        run: composer test:lint

  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.4.27']
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, json, bcmath
          tools: composer:v2
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-test-${{ matrix.php }}-${{ hashFiles('composer.lock') }}

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Audit dependencies
        run: composer audit --locked --abandoned=report --no-interaction

      - name: Setup environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Refactor check (Rector)
        run: composer test:refactor

      - name: Static analysis (PHPStan)
        run: composer test:types

      - name: Tests (Pest)
        run: composer test:unit

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          tags: laravel-api-boilerplate:ci
          load: true
          cache-from: type=gha,scope=laravel-api-production
          cache-to: type=gha,scope=laravel-api-production,mode=max
